:root{--bg:#fffaf8;--sf:#fff;--tx:#2b2326;--mu:#8a7b80;--bd:#eddfe1;--ac:#c2185b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--sf:#221a1d;--tx:#f5ecee;--mu:#a89499;--bd:#3a2c31}}
:root[data-theme="dark"]{--bg:#171214;--sf:#221a1d;--tx:#f5ecee;--mu:#a89499;--bd:#3a2c31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);margin:3px 0 10px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 14px}
.pr{background:var(--ac);color:#fff;border-color:var(--ac)}.dn{color:#d32f2f}
.an{background:var(--ac);color:#fff;text-align:center;padding:6px;font-size:14px}
header{display:flex;gap:10px;align-items:center;padding:12px 5%;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header input{flex:1;min-width:140px;margin:0}.logo{font-size:22px;font-weight:800;color:var(--ac)}
header i{background:var(--ac);color:#fff;border-radius:99px;padding:0 7px;font-style:normal;font-size:12px}
.hero{text-align:center;padding:60px 5%;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 18%,var(--bg)),var(--bg))}
.hero h1{margin:0 0 10px;font-size:clamp(26px,5vw,44px)}.hero p{color:var(--mu);margin:0}
.bar{display:flex;gap:8px;padding:18px 5%;flex-wrap:wrap;align-items:center}.bar select{width:auto;margin:0;margin-inline-start:auto}
.ch.on{background:var(--ac);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0 5% 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;position:relative}
.im{aspect-ratio:1;background:linear-gradient(135deg,#f8d7e3,#fbeee4);display:flex;align-items:center;justify-content:center;font-size:54px;cursor:pointer}
.im img{width:100%;height:100%;object-fit:cover}.cb{padding:12px}.cb h4{margin:0 0 4px;font-size:15px}
.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-inline-start:6px}.pc{color:var(--ac);font-weight:800}
.bd{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--mu)}.empty div{font-size:60px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--bg);border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}.box.w{max-width:960px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .on{background:var(--ac);color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}.st b{font-size:22px;color:var(--ac);display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.sm{font-size:13px;color:var(--mu)}
footer{text-align:center;padding:30px 5%;color:var(--mu);border-top:1px solid var(--bd);font-size:14px}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bd)}
a{color:var(--ac)}
label{font-size:14px;color:var(--mu)}h2,h3{margin:.3em 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;display:none;max-width:90vw;text-align:center}.ch{margin:0}hr{border:0;border-top:1px solid var(--bd)}
